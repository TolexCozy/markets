{% extends "base.html" %}
{% block title %}Reset Password{% endblock title %}
{% block content %}


<div class="card bg-light p-5">

    {% for message in messages %}
    
         <div class="alert alert-{{message.tags}} alert-dismissible fade show" role="alert">
          <strong>{{message}}</strong>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}

<h3 data-aos="fade-up" class="text-dark">Request a Reset Link</h3>



    <form action="/auth/request-reset-email/" method="post">{% csrf_token %}
        <br>

        <label for="email">Email</label>
        <div class="form-group">
            <input type="email" class="form-control p-2" id="email" name="email" required>
        </div>

        < br>
        {% comment %} <label for="pass1">Password</label>
        <div class="form-group">
            <input type="password" class="form-control p-2" id="pass1" name="pass1" required>
        </div> {% endcomment %}

        <button type="submit" class="btn btn-dark">Submit</button>

        <br>
        New User? <a href="/">Go Back</a>
        <br>
    </form>
    
</div>


{% endblock content %}

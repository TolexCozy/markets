{% extends "base.html" %}

{% block title %}Sign Up{% endblock title %}

{% block body %}
<div class="card p-4 shadow-sm mx-auto" style="max-width: 500px;">
    <h3 class="mb-3">Sign Up</h3>

    <!-- Display messages -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form action="{% url 'account:signup' %}" method="POST">
        {% csrf_token %}

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="fname" class="form-label">First Name</label>
                <input type="text" class="form-control" id="fname" name="fname" placeholder="John" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="lname" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lname" name="lname" placeholder="Doe" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
            <label for="pass1" class="form-label">Password</label>
            <input type="password" class="form-control" id="pass1" name="pass1" required>
        </div>
        <div class="mb-3">
            <label for="pass2" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="pass2" name="pass2" required>
        </div>
        <button type="submit" class="btn btn-dark w-100">Sign Up</button>
        <p class="mt-3 text-center">
            Already a user? <a href="{% url 'account:handlelogin' %}">Login</a>
        </p>
    </form>
</div>
{% endblock body %}
